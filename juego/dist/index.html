,#0b0c0e 70%);place-content:center;gap:14px;display:grid;position:fixed;inset:0}#carga h1{letter-spacing:8px;text-align:center;margin:0;font-size:44px;font-weight:800}#carga p{text-align:center;opacity:.5;letter-spacing:2px;margin:0;font-size:14px}.barra{background:#ffffff1a;border-radius:2px;width:260px;height:2px;margin:0 auto;overflow:hidden}.barra i{background:var(--acento);width:38%;height:100%;animation:1.15s ease-in-out infinite desliza;display:block}@keyframes desliza{0%{transform:translate(-100%)}to{transform:translate(360%)}}.err{color:#ff8d7a;text-align:center;max-width:560px;font-family:ui-monospace,monospace;font-size:13px}.ayuda{opacity:.42;letter-spacing:.2px;font-size:12.5px;line-height:1.85;position:absolute;top:22px;left:26px}.ayuda b{opacity:.9;font-weight:650}</style>
