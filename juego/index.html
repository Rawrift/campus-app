<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FRAGUA — caja de arena física</title>
<style>
  :root { --tinta:#f2efe9; --sombra:#0b0c0e; --acento:#ffb257; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--sombra); overflow:hidden;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; color:var(--tinta); }
  #lienzo { display:block; width:100%; height:100%; cursor:crosshair; }

  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }
  .retic { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
           width:22px; height:22px; }
  .retic::before, .retic::after { content:''; position:absolute; background:rgba(255,255,255,.75);
           box-shadow:0 0 2px rgba(0,0,0,.9); transition:background .12s, transform .12s; }
  .retic::before { left:50%; top:0; width:1.5px; height:22px; transform:translateX(-50%); }
  .retic::after  { top:50%; left:0; height:1.5px; width:22px; transform:translateY(-50%); }
  .retic .p { position:absolute; left:50%; top:50%; width:3px; height:3px; border-radius:50%;
           background:rgba(255,255,255,.9); transform:translate(-50%,-50%); }
  .retic.activa::before, .retic.activa::after { background:var(--acento); }
  .retic.activa::before { height:14px; top:4px; }
  .retic.activa::after  { width:14px; left:4px; }

  .inf-izq { position:absolute; left:26px; bottom:22px; }
  .herr { font-size:19px; font-weight:650; letter-spacing:.2px; text-shadow:0 2px 8px #000c; }
  .sub  { font-size:13px; opacity:.62; margin-top:2px; }
  .inf-der { position:absolute; right:26px; bottom:22px; text-align:right;
             font-variant-numeric:tabular-nums; font-size:13px; opacity:.55; }
  .inf-der b { font-size:16px; opacity:.95; font-weight:650; }
  .lin { margin-top:2px; }

  .objetivo { position:absolute; left:50%; top:calc(50% + 34px); transform:translateX(-50%);
              font-size:13.5px; letter-spacing:.2px; opacity:0; transition:opacity .15s;
              text-shadow:0 2px 10px #000d; white-space:nowrap; }
  .aviso { position:absolute; left:50%; top:56px; transform:translateX(-50%);
           background:#0f1114d9; border:1px solid #ffffff1f; border-radius:9px;
           padding:9px 18px; font-size:14px; opacity:0; transition:opacity .25s;
           backdrop-filter:blur(8px); }

  #carga { position:fixed; inset:0; display:grid; place-content:center; gap:14px;
           background:radial-gradient(120% 90% at 50% 40%, #1b1d22 0%, #0b0c0e 70%); z-index:10; }
  #carga h1 { margin:0; font-size:44px; font-weight:800; letter-spacing:8px; text-align:center; }
  #carga p { margin:0; text-align:center; opacity:.5; font-size:14px; letter-spacing:2px; }
  .barra { width:260px; height:2px; background:#ffffff1a; border-radius:2px; overflow:hidden; margin:0 auto; }
  .barra i { display:block; height:100%; width:38%; background:var(--acento);
             animation:desliza 1.15s ease-in-out infinite; }
  @keyframes desliza { 0%{transform:translateX(-100%)} 100%{transform:translateX(360%)} }
  .err { color:#ff8d7a; font-family:ui-monospace,monospace; font-size:13px; max-width:560px; text-align:center; }

  .ayuda { position:absolute; left:26px; top:22px; font-size:12.5px; line-height:1.85;
           opacity:.42; letter-spacing:.2px; }
  .ayuda b { font-weight:650; opacity:.9; }

  /* ---- menús ---- */
  /* Imprescindible: .capa fija display:flex, que ANULA el display:none implícito del atributo
     hidden. Sin esta regla los cuatro menús quedan apilados sobre la pantalla, invisibles por
     el fondo translúcido pero interceptando todos los clics. */
  [hidden] { display:none !important; }
  #menus { position:fixed; inset:0; pointer-events:none; z-index:20; }
  .capa { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          background:#06070ab8; backdrop-filter:blur(7px); animation:aparece .12s ease-out; }
  .capa.oscura { background:#06070ae8; }
  @keyframes aparece { from{opacity:0} to{opacity:1} }
  .panel { background:#14171caa; border:1px solid #ffffff1a; border-radius:16px;
           padding:26px 30px; width:min(880px, 92vw); max-height:86vh; overflow:auto;
           box-shadow:0 28px 80px #000a; }
  .panel.estrecho { width:min(460px, 92vw); }
  .panel.ancho { width:min(1020px, 94vw); }
  .panel.centrado { text-align:center; display:grid; gap:12px; }
  .panel h2 { margin:0 0 18px; font-size:20px; font-weight:700; letter-spacing:.3px; }
  .marca { font-size:40px; letter-spacing:9px; margin:6px 0 18px; font-weight:800; }
  .pie { margin:18px 0 0; font-size:12.5px; opacity:.45; }
  .pie b, kbd { font-weight:650; opacity:.95; }

  .cats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .cat { background:#ffffff0f; border:1px solid #ffffff14; color:var(--tinta); cursor:pointer;
         border-radius:999px; padding:7px 16px; font:inherit; font-size:13px; }
  .cat.activa { background:var(--acento); color:#17130c; border-color:transparent; font-weight:650; }
  .rejilla { display:grid; grid-template-columns:repeat(auto-fill, minmax(132px,1fr)); gap:10px; }
  .celda { background:#ffffff0c; border:1px solid #ffffff12; border-radius:12px; cursor:pointer;
           padding:14px 10px; display:grid; gap:7px; justify-items:center; color:var(--tinta);
           font:inherit; transition:background .12s, transform .12s; }
  .celda:hover { background:#ffffff1c; transform:translateY(-2px); }
  .celda .ico { width:34px; height:34px; border-radius:8px; background:var(--c);
                box-shadow:inset 0 -8px 14px #0006, inset 0 6px 10px #ffffff22; }
  .celda .nom { font-size:12.5px; text-align:center; line-height:1.25; }
  .celda .masa { font-size:11px; opacity:.5; font-variant-numeric:tabular-nums; }

  .lista { display:grid; gap:7px; }
  .fila { background:#ffffff0c; border:1px solid #ffffff12; border-radius:10px; cursor:pointer;
          padding:11px 14px; text-align:left; color:var(--tinta); font:inherit; display:grid; gap:3px; }
  .fila:hover { background:#ffffff1c; }
  .fila b { font-size:14px; }
  .fila span { font-size:12px; opacity:.55; }

  .ayuda-cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:22px; }
  .ayuda-grupo h3 { margin:0 0 9px; font-size:12px; text-transform:uppercase; letter-spacing:1.4px; opacity:.45; }
  .ayuda-fila { display:flex; gap:10px; align-items:baseline; padding:3px 0; font-size:13px; }
  .ayuda-fila kbd { flex:0 0 auto; min-width:64px; background:#ffffff12; border:1px solid #ffffff1a;
                    border-radius:5px; padding:2px 7px; font:inherit; font-size:11.5px; }
  .ayuda-fila i { opacity:.4; font-style:normal; }

  .btn { background:#ffffff12; border:1px solid #ffffff18; color:var(--tinta); cursor:pointer;
         border-radius:10px; padding:12px 18px; font:inherit; font-size:14.5px; font-weight:600; }
  .btn:hover { background:#ffffff22; }
  .btn.sutil { background:transparent; opacity:.6; font-weight:400; font-size:13px; }
  .calidad { display:grid; gap:8px; margin:6px 0; font-size:12px; opacity:.7; }
  .segmentos { display:flex; gap:5px; justify-content:center; }
  .seg { background:#ffffff0f; border:1px solid #ffffff14; color:var(--tinta); cursor:pointer;
         border-radius:8px; padding:7px 13px; font:inherit; font-size:12.5px; }
  .seg.activa { background:var(--acento); color:#17130c; border-color:transparent; font-weight:650; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="hud"></div>
<!-- La pista se rellena en tiempo de ejecución desde la tabla de controles: escribirla a
     mano aquí fue justo lo que hizo que las teclas mostradas no coincidieran con el juego. -->
<div class="ayuda"></div>
<div id="menus"></div>
<div id="carga">
  <h1>FRAGUA</h1>
  <p>CAJA DE ARENA FÍSICA</p>
  <div class="barra"><i></i></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
