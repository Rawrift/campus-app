# Publishes the game to GitHub Pages on every push to the default branch.
#
# To turn it on: repository Settings → Pages → Source: "GitHub Actions".
# The game then lives at https://<owner>.github.io/<repo>/
#
# Vite is configured with `base: './'`, so the build works from a sub-path
# without knowing the repository name.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Typecheck and the simulation tests gate the deploy: a build that fails
      # its own tests should not become the thing people play.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build the single-file version
        run: node tools/build-hosted.mjs

      # Ship the standalone file alongside the site, so it can be downloaded
      # and opened offline.
      - name: Stage downloads
        run: cp dist-single/ossuan.html dist/ossuan-standalone.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
